<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 450px; height: 600px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #1a73e8; color: white; padding: 15px; font-weight: bold; text-align: center; font-size: 1.1em; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 75%; word-wrap: break-word; line-height: 1.4; }
        .user-msg { background: #e3f2fd; color: #0d47a1; align-self: flex-end; }
        .bot-msg { background: #f1f3f4; color: #202124; align-self: flex-start; }
        .input-area { display: flex; border-top: 1px solid #e0e0e0; padding: 10px; background: #fff; }
        input { flex: 1; padding: 12px; border: 1px solid #dadce0; border-radius: 6px; outline: none; font-size: 14px; }
        button { background: #1a73e8; color: white; border: none; padding: 0 16px; margin-left: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Lasso Gemini 2.5 Flash Assistant</div>
    <div id="chatBox" class="chat-box"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const prompt = inputField.value.trim();
        if (!prompt) return;

        appendMessage(prompt, 'user-msg');
        inputField.value = '';

        try {
            // Send the user input to your local FastAPI backend server
            const response = await fetch('/api/v1/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });
            const data = await response.json();
            
            if (data.status === 'success') {
                appendMessage(data.response, 'bot-msg');
            } else {
                appendMessage('Error: Could not retrieve response.', 'bot-msg');
            }
        } catch (error) {
            appendMessage('Error connecting to backend server.', 'bot-msg');
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to latest message
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>
</body>
</html>
